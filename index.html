<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking - Activity 7</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <h1>IPL Ticket Booking</h1>

        <section class="card">
            <h2>Book Your Tickets</h2>

            <form id="bookingForm">

                <label for="match">Select Match:</label>
                <select id="match" name="match">
                    <option value="CSK vs MI">CSK vs MI</option>
                    <option value="RCB vs KKR">RCB vs KKR</option>
                    <option value="MI vs RCB">MI vs RCB</option>
                    <option value="CSK vs RCB">CSK vs RCB</option>
                </select>

                <label for="stand">Select Stand Category:</label>
                <select id="stand" name="stand">
                    <option value="General" data-price="500">General - ₹500</option>
                    <option value="Premium" data-price="1000">Premium - ₹1000</option>
                    <option value="VIP" data-price="2000">VIP - ₹2000</option>
                </select>

                <label for="quantity">Number of Tickets:</label>
                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    min="1"
                    max="10"
                    value="1"
                >

                <button type="submit">Book Tickets</button>
            </form>
        </section>

        <section id="bookingSummary" class="card summary-card">
            <h2>Booking Summary</h2>

            <p>Match: <span id="summaryMatch">-</span></p>
            <p>Stand: <span id="summaryStand">-</span></p>
            <p>Quantity: <span id="summaryQuantity">-</span></p>
            <p>Price per Ticket: ₹<span id="summaryPrice">0</span></p>

            <h3>
                Total Price: ₹<span id="totalPrice">0</span>
            </h3>
        </section>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
</body>
</html>
